<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>读取一个字体文件的glyph数据（永）</title>
    <style>
      #container {
        position: relative;
        width: 540px; /* canvas width + 20px for the ruler */
        height: 540px; /* canvas height + 20px for the ruler */
      }
      #fontCanvas {
        position: absolute;
        top: 40px;
        left: 40px;
        width: 500px;
        height: 500px;
        border: 1px dashed #000;
        box-sizing: border-box;
      }
      #fontRasterCanvas {
        width: min(72vw, 720px);
        height: min(72vw, 720px);
        border: 1px dashed #000;
        image-rendering: pixelated;
        cursor: crosshair;
      }
      #fontRasterCanvas:focus-visible {
        outline: 3px solid #1473e6;
        outline-offset: 2px;
      }
      #fontDetailCanvas {
        width: min(72vw, 520px);
        height: min(72vw, 520px);
        border: 1px dashed #000;
        image-rendering: pixelated;
      }
      #cpuViews {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        flex-wrap: wrap;
      }
      .canvasLabel {
        margin: 0 0 6px;
        font: 13px/1.4 Arial, sans-serif;
        color: #333;
      }
      #rulerX,
      #rulerY {
        position: absolute;
        background: #f0f0f0;
        font-size: 10px;
        color: #333;
      }
      #rulerX {
        top: 0;
        left: 40px;
        width: 500px;
        height: 40px;
      }
      #rulerY {
        top: 40px;
        left: 0;
        width: 40px;
        height: 500px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <canvas id="fontCanvas" width="1000" height="1000"></canvas>
      <canvas id="rulerX" width="1000" height="40"></canvas>
      <canvas id="rulerY" width="40" height="1000"></canvas>
    </div>

    <div id="cpuViews">
      <div>
        <div class="canvasLabel">CPU raster · 5 × 5 grid</div>
        <canvas
          id="fontRasterCanvas"
          width="1000"
          height="1000"
          tabindex="0"
          role="grid"
          aria-label="CPU raster grid"
        ></canvas>
      </div>
      <div>
        <div class="canvasLabel" id="detailLabel">Cell (1, 0)</div>
        <canvas id="fontDetailCanvas" width="600" height="600"></canvas>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.3/opentype.min.js"></script>
    <script>
      async function loadFont(url) {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        const font = opentype.parse(arrayBuffer);
        return font;
      }
      function drawGrid(ctx, width, height, gridSize) {
        ctx.strokeStyle = "#ddd";
        ctx.lineWidth = 1;

        for (let x = 0; x <= width; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }

        for (let y = 0; y <= height; y += gridSize) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
      }

      function drawRulerX(ctx, width, gridSize) {
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 1;
        ctx.font = "10px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (let x = 0; x <= width; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, 10);
          ctx.stroke();
          ctx.fillText(x, x, 15);
        }
      }

      function drawRulerY(ctx, height, gridSize) {
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 1;
        ctx.font = "10px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (let y = height; y >= 0; y -= gridSize) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(10, y);
          ctx.stroke();
          ctx.fillText(height - y, 15, y);
        }
      }

      function convertToQuadraticBezierArray(commands) {
        const quadraticBeziers = [];
        let currentX, currentY; // 当前点坐标
        let startX, startY; // 当前子路径的起点（用于闭合路径）

        for (const cmd of commands) {
          switch (cmd.type) {
            case "M": // moveTo: 更新起点，不生成曲线
              currentX = cmd.x;
              currentY = cmd.y;
              startX = currentX;
              startY = currentY;
              break;

            case "L": {
              // lineTo: 转换为二次曲线（控制点为中点）
              const endX = cmd.x,
                endY = cmd.y;
              quadraticBeziers.push({
                type: "quadratic",
                start: { x: currentX, y: currentY },
                control: { x: (currentX + endX) / 2, y: (currentY + endY) / 2 },
                end: { x: endX, y: endY },
              });
              currentX = endX;
              currentY = endY;
              break;
            }

            case "Q": // quadraticCurveTo: 直接保留
              quadraticBeziers.push({
                type: "quadratic",
                start: { x: currentX, y: currentY },
                control: { x: cmd.x1, y: cmd.y1 },
                end: { x: cmd.x, y: cmd.y },
              });
              currentX = cmd.x;
              currentY = cmd.y;
              break;

            case "C": {
              // cubicCurveTo: 分割为多个二次曲线
              const p0 = { x: currentX, y: currentY };
              const p1 = { x: cmd.x1, y: cmd.y1 };
              const p2 = { x: cmd.x2, y: cmd.y2 };
              const p3 = { x: cmd.x, y: cmd.y };

              splitCubicToQuadratics(p0, p1, p2, p3, 3).forEach((quad) => {
                quadraticBeziers.push(quad);
              });

              currentX = p3.x;
              currentY = p3.y;
              break;
            }

            case "Z": // closePath: 生成闭合线段二次曲线
              if (currentX !== startX || currentY !== startY) {
                quadraticBeziers.push({
                  type: "quadratic",
                  start: { x: currentX, y: currentY },
                  control: {
                    x: (currentX + startX) / 2,
                    y: (currentY + startY) / 2,
                  },
                  end: { x: startX, y: startY },
                });
                currentX = startX;
                currentY = startY;
              }
              break;

            default:
              throw new Error(`unknown command: ${cmd.type}`);
          }
        }

        return quadraticBeziers;
      }

      // 使用 de Casteljau 细分，再把每段三次曲线降阶为二次曲线。
      function splitCubicToQuadratics(p0, p1, p2, p3, depth) {
        if (depth <= 0) {
          return [
            {
              type: "quadratic",
              start: p0,
              control: {
                x: (3 * p1.x + 3 * p2.x - p0.x - p3.x) / 4,
                y: (3 * p1.y + 3 * p2.y - p0.y - p3.y) / 4,
              },
              end: p3,
            },
          ];
        }

        const p01 = midpoint(p0, p1);
        const p12 = midpoint(p1, p2);
        const p23 = midpoint(p2, p3);
        const p012 = midpoint(p01, p12);
        const p123 = midpoint(p12, p23);
        const split = midpoint(p012, p123);

        return [
          ...splitCubicToQuadratics(p0, p01, p012, split, depth - 1),
          ...splitCubicToQuadratics(split, p123, p23, p3, depth - 1),
        ];
      }

      function midpoint(a, b) {
        return {
          x: (a.x + b.x) / 2,
          y: (a.y + b.y) / 2,
        };
      }

      function clamp(number, min, max) {
        return Math.max(min, Math.min(number, max));
      }
      function almostEqual(a, b, epsilon = 1e-6) {
        return Math.abs(a - b) <= epsilon;
      }

      function pointOnQuadratic(bezier, t) {
        const mt = 1 - t;
        return {
          x:
            mt * mt * bezier.start.x +
            2 * mt * t * bezier.control.x +
            t * t * bezier.end.x,
          y:
            mt * mt * bezier.start.y +
            2 * mt * t * bezier.control.y +
            t * t * bezier.end.y,
        };
      }

      function quadraticRoots(p0, p1, p2, value) {
        const a = p0 - 2 * p1 + p2;
        const b = 2 * (p1 - p0);
        const c = p0 - value;
        const epsilon = 1e-9;

        if (almostEqual(a, 0, epsilon)) {
          if (almostEqual(b, 0, epsilon)) {
            return [];
          }
          return [-c / b];
        }

        const discriminant = b * b - 4 * a * c;
        if (discriminant < -epsilon) {
          return [];
        }
        if (almostEqual(discriminant, 0, epsilon)) {
          return [-b / (2 * a)];
        }

        const sqrtDiscriminant = Math.sqrt(discriminant);
        return [
          (-b - sqrtDiscriminant) / (2 * a),
          (-b + sqrtDiscriminant) / (2 * a),
        ];
      }

      function bezierIntersectHorz(bezier, Y) {
        const roots = quadraticRoots(
          bezier.start.y,
          bezier.control.y,
          bezier.end.y,
          Y,
        )
          .filter((t) => t >= 0 && t <= 1)
          .map((t) => pointOnQuadratic(bezier, t).x);
        return { rootNum: roots.length, roots };
      }

      function bezierIntersectVert(bezier, X) {
        const { start, control, end } = bezier;

        const bezierInverse = {
          start: { x: start.y, y: start.x },
          control: { x: control.y, y: control.x },
          end: { x: end.y, y: end.x },
        };
        return bezierIntersectHorz(bezierInverse, X);
      }
      // 按照网格，将 glyph 贝塞尔曲线做逻辑上的切割，
      // 每个单元格保存可能与它相交的曲线，供局部观察使用。
      function makeGridOnBezier(normCurves, cboxSize, gridSize) {
        const { w: gridWidth, h: gridHeight } = gridSize;

        const grid = Array.from(
          { length: gridWidth * gridHeight },
          () => [],
        );
        normCurves.forEach((curve, curveIndex) => {
          const bounds = quadraticBounds(curve);
          const minX = clamp(
            Math.floor((bounds.minX / cboxSize.w) * gridWidth),
            0,
            gridWidth - 1,
          );
          const maxX = clamp(
            Math.floor((bounds.maxX / cboxSize.w) * gridWidth),
            0,
            gridWidth - 1,
          );
          const minY = clamp(
            Math.floor((bounds.minY / cboxSize.h) * gridHeight),
            0,
            gridHeight - 1,
          );
          const maxY = clamp(
            Math.floor((bounds.maxY / cboxSize.h) * gridHeight),
            0,
            gridHeight - 1,
          );

          for (let y = minY; y <= maxY; y++) {
            for (let x = minX; x <= maxX; x++) {
              grid[y * gridWidth + x].push(curveIndex);
            }
          }
        });
        return grid;
      }

      function quadraticBounds(curve) {
        const xs = [curve.start.x, curve.end.x];
        const ys = [curve.start.y, curve.end.y];

        addQuadraticExtremum(
          curve.start.x,
          curve.control.x,
          curve.end.x,
          xs,
        );
        addQuadraticExtremum(
          curve.start.y,
          curve.control.y,
          curve.end.y,
          ys,
        );

        return {
          minX: Math.min(...xs),
          maxX: Math.max(...xs),
          minY: Math.min(...ys),
          maxY: Math.max(...ys),
        };
      }

      function addQuadraticExtremum(p0, p1, p2, values) {
        const denominator = p0 - 2 * p1 + p2;
        if (almostEqual(denominator, 0)) {
          return;
        }
        const t = (p0 - p1) / denominator;
        if (t > 0 && t < 1) {
          const mt = 1 - t;
          values.push(mt * mt * p0 + 2 * mt * t * p1 + t * t * p2);
        }
      }

      function relativeTo(srcPoint, origin) {
        return {
          x: srcPoint.x - origin.x,
          y: srcPoint.y - origin.y,
        };
      }

      /**
       * 将 em 空间内的坐标转换为 cbox 空间内;
       * 坐标原点在左下角，Y 向上
       * 单位值域范围是 unitsPerEm(1000)
       */
      function translateCurveOrigin(font, glyph, curves) {
        const cbox = glyph.getMetrics();
        const origin = {
          x: cbox.xMin,
          y: cbox.yMin,
        };
        curves.forEach((curve) => {
          curve.start = relativeTo(curve.start, origin);
          curve.control = relativeTo(curve.control, origin);
          curve.end = relativeTo(curve.end, origin);
        });
      }
      const cpuGridSize = { w: 5, h: 5 };
      let cpuRasterState = null;

      function buildHorizontalBands(curves, cboxSize, bandCount) {
        const bands = Array.from({ length: bandCount }, () => []);
        curves.forEach((curve, curveIndex) => {
          const bounds = quadraticBounds(curve);
          const minBand = clamp(
            Math.floor((bounds.minY / cboxSize.h) * bandCount),
            0,
            bandCount - 1,
          );
          const maxBand = clamp(
            Math.floor((bounds.maxY / cboxSize.h) * bandCount),
            0,
            bandCount - 1,
          );
          for (let band = minBand; band <= maxBand; band++) {
            bands[band].push(curveIndex);
          }
        });
        return bands;
      }

      /**
       * Eric Lengyel 字形渲染算法中“水平根贡献分类”的 CPU 解释示例。
       *
       * 0x2e74 根据二次贝塞尔三个控制点相对水平扫描线的符号，
       * 编码两个方程根是否分别对绕数产生 +1 / -1 贡献。
       * 此处只用 winding != 0 演示二值内外判定，不包含原算法的
       * 连续像素覆盖率、垂直方向计算、双轴合并和抗锯齿。
       */
      function lengyelCurveWindingContribution(curve, x, y) {
        const e0Local = {
          x: curve.start.x - x,
          y: curve.start.y - y,
        };
        const controlLocal = {
          x: curve.control.x - x,
          y: curve.control.y - y,
        };
        const e1Local = {
          x: curve.end.x - x,
          y: curve.end.y - y,
        };

        const offset =
          (e0Local.y > 0 ? 2 : 0) +
          (controlLocal.y > 0 ? 4 : 0) +
          (e1Local.y > 0 ? 8 : 0);
        const code = (0x2e74 >> offset) & 3;
        if (code === 0) {
          return 0;
        }

        // y(t) = ay*t^2 - 2*by*t + e0Local.y
        const ax = e0Local.x - 2 * controlLocal.x + e1Local.x;
        const ay = e0Local.y - 2 * controlLocal.y + e1Local.y;
        const bx = e0Local.x - controlLocal.x;
        const by = e0Local.y - controlLocal.y;
        let t1;
        let t2;

        if (almostEqual(ay, 0, 1e-9)) {
          if (almostEqual(by, 0, 1e-9)) {
            return 0;
          }
          t1 = e0Local.y / (2 * by);
          t2 = t1;
        } else {
          const discriminant = Math.max(
            by * by - ay * e0Local.y,
            0,
          );
          const root = Math.sqrt(discriminant);
          t1 = (by - root) / ay;
          t2 = (by + root) / ay;
        }

        // 修改前误把 y 常数项用于 x(t)；这里应当使用 e0Local.x。
        const x1 = (ax * t1 - 2 * bx) * t1 + e0Local.x;
        const x2 = (ax * t2 - 2 * bx) * t2 + e0Local.x;
        let contribution = 0;
        if ((code & 1) !== 0 && x1 >= 0) {
          contribution++;
        }
        if ((code & 2) !== 0 && x2 >= 0) {
          contribution--;
        }
        return contribution;
      }

      function windingAtPoint(x, y, curves, curveIndices) {
        let winding = 0;

        for (const curveIndex of curveIndices) {
          winding += lengyelCurveWindingContribution(
            curves[curveIndex],
            x,
            y,
          );
        }
        return winding;
      }

      function rasterizeGlyphCPU(curves, cboxSize, horizontalBands) {
        const width = Math.ceil(cboxSize.w);
        const height = Math.ceil(cboxSize.h);
        const source = document.createElement("canvas");
        source.width = width;
        source.height = height;
        const sourceCtx = source.getContext("2d");
        const image = sourceCtx.createImageData(width, height);

        for (let y = 0; y < height; y++) {
          const sampleY = y + 0.5;
          const band = clamp(
            Math.floor((sampleY / cboxSize.h) * horizontalBands.length),
            0,
            horizontalBands.length - 1,
          );
          const candidates = horizontalBands[band];
          const imageY = height - 1 - y;

          for (let x = 0; x < width; x++) {
            const gridX = clamp(
              Math.floor(((x + 0.5) / cboxSize.w) * cpuGridSize.w),
              0,
              cpuGridSize.w - 1,
            );
            const gridY = clamp(
              Math.floor((sampleY / cboxSize.h) * cpuGridSize.h),
              0,
              cpuGridSize.h - 1,
            );
            const checker = (gridX + gridY) % 2 === 0;
            const inside =
              windingAtPoint(x + 0.5, sampleY, curves, candidates) !== 0;
            const value = inside ? 28 : checker ? 248 : 232;
            const pixel = (imageY * width + x) * 4;
            image.data[pixel] = value;
            image.data[pixel + 1] = inside ? value : checker ? 248 : 238;
            image.data[pixel + 2] = inside ? value : checker ? 248 : 242;
            image.data[pixel + 3] = 255;
          }
        }

        sourceCtx.putImageData(image, 0, 0);
        return source;
      }

      function drawGlyphByCPU(canvas, font, glyph) {
        const ctx = canvas.getContext("2d");
        const pathCommands = glyph.path.commands;
        const curves = convertToQuadraticBezierArray(pathCommands);
        translateCurveOrigin(font, glyph, curves);

        const cbox = glyph.getMetrics();
        const cboxSize = {
          w: cbox.xMax - cbox.xMin,
          h: cbox.yMax - cbox.yMin,
        };
        const grid = makeGridOnBezier(curves, cboxSize, cpuGridSize);
        const horizontalBands = buildHorizontalBands(
          curves,
          cboxSize,
          cpuGridSize.h,
        );
        const rasterSource = rasterizeGlyphCPU(
          curves,
          cboxSize,
          horizontalBands,
        );

        cpuRasterState = {
          canvas,
          ctx,
          curves,
          cboxSize,
          grid,
          rasterSource,
          selectedCell: { x: 1, y: 0 },
        };
        renderCPUViews();
      }

      function renderCPUViews() {
        if (!cpuRasterState) {
          return;
        }
        const {
          canvas,
          ctx,
          cboxSize,
          rasterSource,
          selectedCell,
        } = cpuRasterState;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(
          rasterSource,
          0,
          canvas.height - rasterSource.height,
        );

        const cellWidth = cboxSize.w / cpuGridSize.w;
        const cellHeight = cboxSize.h / cpuGridSize.h;
        ctx.strokeStyle = "rgba(180, 30, 30, 0.5)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= cpuGridSize.w; x++) {
          const canvasX = x * cellWidth;
          ctx.moveTo(canvasX, canvas.height - cboxSize.h);
          ctx.lineTo(canvasX, canvas.height);
        }
        for (let y = 0; y <= cpuGridSize.h; y++) {
          const canvasY = canvas.height - y * cellHeight;
          ctx.moveTo(0, canvasY);
          ctx.lineTo(cboxSize.w, canvasY);
        }
        ctx.stroke();

        ctx.strokeStyle = "#1473e6";
        ctx.lineWidth = 4;
        ctx.strokeRect(
          selectedCell.x * cellWidth,
          canvas.height - (selectedCell.y + 1) * cellHeight,
          cellWidth,
          cellHeight,
        );
        renderCPUDetail();
      }

      function renderCPUDetail() {
        const detail = document.getElementById("fontDetailCanvas");
        const detailCtx = detail.getContext("2d");
        const {
          curves,
          cboxSize,
          grid,
          rasterSource,
          selectedCell,
        } = cpuRasterState;
        const cellWidth = cboxSize.w / cpuGridSize.w;
        const cellHeight = cboxSize.h / cpuGridSize.h;
        const x0 = selectedCell.x * cellWidth;
        const y0 = selectedCell.y * cellHeight;
        const sourceY = rasterSource.height - y0 - cellHeight;
        const curveIndices =
          grid[selectedCell.y * cpuGridSize.w + selectedCell.x];

        detailCtx.clearRect(0, 0, detail.width, detail.height);
        detailCtx.imageSmoothingEnabled = false;
        detailCtx.drawImage(
          rasterSource,
          x0,
          sourceY,
          cellWidth,
          cellHeight,
          0,
          0,
          detail.width,
          detail.height,
        );

        const transform = (point) => ({
          x: ((point.x - x0) / cellWidth) * detail.width,
          y: detail.height - ((point.y - y0) / cellHeight) * detail.height,
        });

        detailCtx.save();
        detailCtx.beginPath();
        detailCtx.rect(0, 0, detail.width, detail.height);
        detailCtx.clip();

        for (const curveIndex of curveIndices) {
          const curve = curves[curveIndex];
          const start = transform(curve.start);
          const control = transform(curve.control);
          const end = transform(curve.end);

          detailCtx.strokeStyle = "rgba(0, 150, 170, 0.75)";
          detailCtx.lineWidth = 1;
          detailCtx.setLineDash([5, 4]);
          detailCtx.beginPath();
          detailCtx.moveTo(start.x, start.y);
          detailCtx.lineTo(control.x, control.y);
          detailCtx.lineTo(end.x, end.y);
          detailCtx.stroke();

          detailCtx.strokeStyle = "#ff6b00";
          detailCtx.lineWidth = 2;
          detailCtx.setLineDash([]);
          detailCtx.beginPath();
          detailCtx.moveTo(start.x, start.y);
          detailCtx.quadraticCurveTo(control.x, control.y, end.x, end.y);
          detailCtx.stroke();

          drawDetailPoint(detailCtx, start, "#1473e6");
          drawDetailPoint(detailCtx, end, "#1473e6");
          drawDetailPoint(detailCtx, control, "#00a36c");
        }
        detailCtx.restore();

        document.getElementById("detailLabel").textContent =
          `Cell (${selectedCell.x}, ${selectedCell.y}) · ${curveIndices.length} curves`;
      }

      function drawDetailPoint(ctx, point, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      document
        .getElementById("fontRasterCanvas")
        .addEventListener("click", (event) => {
          if (!cpuRasterState) {
            return;
          }
          event.currentTarget.focus();
          const { canvas, cboxSize } = cpuRasterState;
          const rect = canvas.getBoundingClientRect();
          const canvasX =
            ((event.clientX - rect.left) / rect.width) * canvas.width;
          const canvasY =
            ((event.clientY - rect.top) / rect.height) * canvas.height;
          const glyphY = canvas.height - canvasY;
          if (
            canvasX < 0 ||
            canvasX >= cboxSize.w ||
            glyphY < 0 ||
            glyphY >= cboxSize.h
          ) {
            return;
          }
          cpuRasterState.selectedCell = {
            x: clamp(
              Math.floor((canvasX / cboxSize.w) * cpuGridSize.w),
              0,
              cpuGridSize.w - 1,
            ),
            y: clamp(
              Math.floor((glyphY / cboxSize.h) * cpuGridSize.h),
              0,
              cpuGridSize.h - 1,
            ),
          };
          renderCPUViews();
        });

      document
        .getElementById("fontRasterCanvas")
        .addEventListener("keydown", (event) => {
          if (!cpuRasterState) {
            return;
          }
          const delta = {
            ArrowLeft: { x: -1, y: 0 },
            ArrowRight: { x: 1, y: 0 },
            ArrowDown: { x: 0, y: -1 },
            ArrowUp: { x: 0, y: 1 },
          }[event.key];
          if (!delta) {
            return;
          }
          event.preventDefault();
          const selected = cpuRasterState.selectedCell;
          cpuRasterState.selectedCell = {
            x: clamp(selected.x + delta.x, 0, cpuGridSize.w - 1),
            y: clamp(selected.y + delta.y, 0, cpuGridSize.h - 1),
          };
          renderCPUViews();
        });
      async function drawGlyph(fontUrl, char) {
        const font = await loadFont(fontUrl);
        const glyph = font.charToGlyph(char);
        const canvas = document.getElementById("fontCanvas");
        const ctx = canvas.getContext("2d");
        const canvasWidth = canvas.width;
        const canvasHeight = canvas.height;
        const fontSize = Math.min(canvasWidth, canvasHeight) * 1.06; // 使字体大小适应画布

        const scale = fontSize / font.unitsPerEm;

        console.log("font", font);
        // 将 glyph 的信息打印到控制台
        console.log("glyph:", glyph);

        // 计算边界框的中心位置
        const bboxWidth = (glyph.xMax - glyph.xMin) * scale;
        const bboxHeight = (glyph.yMax - glyph.yMin) * scale;
        const x = (canvasWidth - bboxWidth) / 2 - glyph.xMin * scale;
        const y = (canvasHeight - bboxHeight) / 2 + glyph.yMax * scale;

        console.log("x:", x, "y:", y, "fontSize:", fontSize);

        const path = glyph.getPath(x, y, fontSize); // x, y, fontSize

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid(ctx, canvasWidth, canvasHeight, canvasWidth / 5); // 绘制网格背景，网格大小为 50

        path.stroke = "red";
        path.fill = "transparent";
        path.draw(ctx);

        // glyph.draw(ctx, x, 400, fontSize, font);
        glyph.drawPoints(ctx, x, y, fontSize, font);
        glyph.drawMetrics(ctx, x, y, fontSize);

        const rasterCanvas = document.getElementById("fontRasterCanvas");
        drawGlyphByCPU(rasterCanvas, font, glyph);
      }

      function drawRulers() {
        const rulerX = document.getElementById("rulerX");
        const rulerY = document.getElementById("rulerY");
        const ctxX = rulerX.getContext("2d");
        const ctxY = rulerY.getContext("2d");
        drawRulerX(ctxX, rulerX.width, 50); // 绘制 X 轴坐标尺，网格大小为 50
        drawRulerY(ctxY, rulerY.height, 50); // 绘制 Y 轴坐标尺，网格大小为 50
      }

      drawRulers();

      drawGlyph("./STSong.ttf", "永");
    </script>
  </body>
