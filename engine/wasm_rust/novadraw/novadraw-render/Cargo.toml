[package]
name = "novadraw-render"
version.workspace = true
edition.workspace = true

[dependencies]
novadraw-geometry = { path = "../novadraw-geometry" }
novadraw-core = { path = "../novadraw-core" }
serde.workspace = true
tracing.workspace = true
uuid.workspace = true
parley.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
resvg.workspace = true
kurbo.workspace = true

vello = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
pollster = { version = "0.4.0", optional = true }

[features]
default = []
vello = [
    "dep:vello",
    "dep:raw-window-handle",
    "dep:pollster",
    "dep:objc2-core-graphics",
    "dep:objc2-quartz-core",
]
vello-web = ["dep:vello", "dep:web-sys"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3.2", features = ["CGColor"], optional = true }
objc2-quartz-core = { version = "0.3.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.104", features = ["HtmlCanvasElement"], optional = true }
