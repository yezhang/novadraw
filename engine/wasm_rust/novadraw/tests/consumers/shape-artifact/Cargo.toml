[package]
name = "novadraw-shape-artifact"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
independent = []

[dependencies]
novadraw = { path = "../../../crates/novadraw" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
