[[suites]]
id = "web.build"
title = "Wasm and browser validation build"
milestone = "platform-web"
kind = "build"
layers = ["static", "platform"]
platforms = ["wasm", "web"]
commands = ["web.build"]
paths = [
  "apps/web/web-validation/**",
  "novadraw-demo-scenes/**",
  "scripts/build_web_validation.sh",
]
documents = ["apps/web/web-validation/README.md"]
artifacts = ["apps/web/web-validation/dist"]
manual = { command = "web.serve", document = "doc/verification/manual/web-platform.md" }
