[profiles.quick]
description = "Fast workspace formatting and compilation feedback"
commands = [
  "workspace.fmt",
  "workspace.check",
  "facade.core",
  "facade.dependencies",
  "api.third-party-types",
  "dependencies.kurbo",
  "backend.native-vello",
  "backend.web-vello",
]

[profiles.full]
description = "Complete local submission gate"
commands = [
  "workspace.fmt",
  "facade.core",
  "facade.dependencies",
  "api.third-party-types",
  "dependencies.kurbo",
  "backend.native-vello",
  "backend.web-vello",
  "workspace.clippy",
  "workspace.test",
]

[[suites]]
id = "core.facade"
title = "Core API and optional package boundaries"
milestone = "Core API"
kind = "contract"
layers = ["static", "contract"]
platforms = ["host", "native-macos", "web"]
commands = [
  "facade.core",
  "test.facade-doc",
  "facade.dependencies",
  "api.third-party-types",
  "dependencies.kurbo",
  "backend.native-vello",
  "backend.web-vello",
]
paths = [
  "novadraw/**",
  "novadraw-backend-vello/**",
  "novadraw-platform-winit/**",
  "novadraw-platform-web/**",
  "novadraw-editor/**",
  "novadraw-inspector/**",
  "examples/**",
  "benchmarks/**",
]
documents = [
  "doc/adr/adr-021-public-facade-and-feature-boundary.md",
  "doc/adr/adr-022-third-party-type-and-render-dependency-boundary.md",
  "doc/adr/adr-023-crate-consolidation-and-extension-boundaries.md",
]

[[suites]]
