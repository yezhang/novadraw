schema_version = 1
evidence_root = "target/verification"

[documentation]
parity_ledgers = [
  "doc/parity/draw2d/api-coverage.md",
  "doc/parity/gef/api-coverage.md",
]
allowed_parity_statuses = [
  "specified",
  "partial",
  "verified",
  "deferred",
  "rejected",
]

[commands."workspace.fmt"]
description = "Check Rust formatting for the complete workspace"
program = "cargo"
args = ["fmt", "--all", "--", "--check"]

[commands."workspace.check"]
description = "Compile all workspace packages"
program = "cargo"
args = ["check", "--workspace"]

[commands."workspace.clippy"]
description = "Reject Clippy warnings in workspace targets"
program = "cargo"
args = ["clippy", "--workspace", "--", "-D", "warnings"]

[commands."workspace.test"]
description = "Run all workspace unit, integration, and documentation tests"
program = "cargo"
args = ["test", "--workspace"]

[commands."facade.core"]
description = "Compile the standard facade without a platform backend"
program = "cargo"
args = ["check", "-p", "novadraw", "--no-default-features"]

[commands."test.facade-doc"]
description = "Verify positive and negative facade import examples independently"
program = "cargo"
args = ["test", "-p", "novadraw", "--doc"]

[commands."backend.native-vello"]
description = "Compile the native Vello backend"
program = "cargo"
args = [
  "check",
  "-p",
  "novadraw-backend-vello",
  "--features",
  "native",
]

[commands."backend.web-vello"]
description = "Compile the Web Vello backend"
program = "cargo"
args = [
  "check",
  "-p",
  "novadraw-backend-vello",
  "--target",
  "wasm32-unknown-unknown",
  "--features",
  "web",
]

[commands."facade.dependencies"]
description = "Reject editor, inspector, backend, and platform dependencies from Core"
program = "./scripts/check_facade_dependencies.sh"

[commands."api.third-party-types"]
description = "Reject Kurbo, Vello, and Winit types from public API signatures"
program = "./scripts/check_public_api_dependencies.sh"

[commands."dependencies.kurbo"]
description = "Require one Kurbo version across all workspace feature graphs"
program = "./scripts/check_kurbo_versions.sh"

[commands."report.binary-size"]
description = "Build a representative release application and record its binary size"
program = "./scripts/report_binary_size.sh"

[commands."report.ga2-performance"]
description = "Run the fixed headless CPU performance scenarios and retain raw samples"
program = "cargo"
args = [
  "run",
  "--release",
  "-p",
  "r8-perf",
  "--",
  "--report=target/verification/reports/ga2-novadraw.json",
]

[commands."test.render-image-source"]
description = "Run the backend-neutral image source rectangle contract"
program = "cargo"
args = [
  "test",
  "-p",
  "novadraw",
  "--test",
  "image_source_rectangle_contract",
]

[commands."test.vello-image-source"]
description = "Run the Vello image source rectangle lowering contract"
program = "cargo"
args = [
  "test",
  "-p",
  "novadraw-backend-vello",
  "--features",
  "native",
  "--lib",
  "image_source_region_maps_to_destination_and_requires_a_destination_clip",
]

[commands."verify.update"]
description = "Run deterministic UpdateManager application probes"
program = "cargo"
args = [
  "run",
  "-p",
  "update-app",
  "--",
  "--verify",
  "--report=target/verification/reports/update-app.json",
]

[commands."verify.event"]
description = "Run deterministic event dispatch application probes"
program = "cargo"
args = [
  "run",
  "-p",
  "event-app",
  "--",
  "--verify",
  "--report=target/verification/reports/event-app.json",
]

[commands."verify.scroll-pane"]
description = "Run deterministic viewport, scroll, and zoom application probes"
program = "cargo"
args = [
  "run",
  "-p",
  "scroll-pane-demo",
  "--",
  "--verify",
  "--report=target/verification/reports/scroll-pane-demo.json",
]

[commands."test.scene-dispatch"]
description = "Run the public Figure/Editor dispatch outcome contract"
program = "cargo"
args = ["test", "-p", "novadraw", "--test", "p2_dispatch_outcome_contract"]

[commands."test.scene-viewport"]
description = "Run the M8 viewport contract"
program = "cargo"
args = ["test", "-p", "novadraw", "--test", "m8_viewport_contract"]

[commands."test.scene-connection"]
description = "Run the Draw2D connection, anchor, router, and locator contract"
program = "cargo"
args = ["test", "-p", "novadraw", "--test", "m9_connection_contract"]

[commands."test.p2-c01"]
description = "Run PointList bounds, endpoint locator, and decoration contracts"
program = "cargo"
args = [
  "test",
  "-p",
  "novadraw",
  "--test",
  "m9_connection_contract",
  "--test",
  "m9_connection_runtime",
  "--test",
  "m10_reusable_shape_border_contract",
]

[commands."test.p2-c02"]
description = "Run obstacle-aware shortest-path routing contracts"
program = "cargo"
args = [
  "test",
  "-p",
  "novadraw",
  "--test",
  "m9_connection_contract",
  "--test",
  "m9_connection_runtime",
  "--test",
  "p2_c02_shortest_path_contract",
]

[commands."test.p2-f01"]
description = "Run ScalablePolygonFigure contracts"
program = "cargo"
args = ["test", "-p", "novadraw", "--test", "p2_f01_scalable_polygon_contract"]

[commands."test.p2-t01"]
description = "Run TextFlow paragraph, wrapping, bidi, and truncation contracts"
program = "cargo"
args = [
  "test",
  "-p",
  "novadraw",
  "--test",
  "p2_t01_text_flow_contract",
]

[commands."test.p2-t02"]
description = "Run TextFlow document-position and interaction geometry contracts"
program = "cargo"
args = [
  "test",
  "-p",
  "novadraw",
  "--test",
  "p2_t02_text_interaction_contract",
]

[commands."test.editor-p2-e02"]
description = "Run direct text edit session, draft, feedback, and command contracts"
program = "cargo"
args = [
  "test",
  "-p",
  "novadraw-editor",
  "--test",
  "p2_e02_direct_text_edit_contract",
]

[commands."test.platform-winit-p2-e02"]
description = "Run Winit direct text input bridge contracts"
program = "cargo"
args = ["test", "-p", "novadraw-platform-winit", "--features", "editor"]

[commands."test.platform-web-p2-e02"]
description = "Run Web direct text input bridge contracts"
program = "cargo"
args = ["test", "-p", "novadraw-platform-web", "--features", "editor"]

[commands."build.platform-web-p2-e02"]
description = "Compile the DOM text input host for wasm32"
program = "cargo"
args = [
  "check",
  "-p",
  "novadraw-platform-web",
  "--features",
  "editor",
  "--target",
  "wasm32-unknown-unknown",
]

[commands."test.node-editor-p2-e02"]
description = "Run the native node-editor direct text edit application contracts"
program = "cargo"
args = [
  "test",
  "-p",
  "node-editor-demo",
  "direct_text_edit",
]

[commands."test.editor-g1-model"]
description = "Run the G1 model adapter contract"
program = "cargo"
args = ["test", "-p", "novadraw-editor", "--test", "g1_model_contract"]

[commands."test.editor-g1-command"]
description = "Run the G1 command stack contract"
program = "cargo"
args = ["test", "-p", "novadraw-editor", "--test", "g1_command_stack_contract"]

[commands."test.editor-g2"]
description = "Run the G2 viewer projection contract"
program = "cargo"
args = ["test", "-p", "novadraw-editor", "--test", "g2_viewer_projection_contract"]

[commands."test.editor-g3-selection"]
description = "Run the G3 selection model contract"
program = "cargo"
args = ["test", "-p", "novadraw-editor", "--test", "g3_selection_contract"]

[commands."test.editor-g3-interaction"]
description = "Run the G3 viewer interaction contract"
program = "cargo"
args = ["test", "-p", "novadraw-editor", "--test", "g3_viewer_interaction_contract"]

[commands."test.editor-g4"]
description = "Run the G4 editing loop contract"
program = "cargo"
args = ["test", "-p", "novadraw-editor", "--test", "g4_editing_loop_contract"]

[commands."test.editor-g5-projection"]
description = "Run the G5 connection projection contract"
program = "cargo"
args = ["test", "-p", "novadraw-editor", "--test", "g5_connection_projection_contract"]

[commands."test.editor-g5-editing"]
description = "Run the G5 create, reconnect, and bendpoint contract"
program = "cargo"
args = ["test", "-p", "novadraw-editor", "--test", "g5_connection_creation_contract"]

[commands."web.build"]
description = "Build the Web validation application and wasm-bindgen output"
program = "./scripts/build_web_validation.sh"

[commands."web.serve"]
description = "Serve the Web validation application on localhost"
program = "./scripts/serve_web_validation.sh"

[commands."native.node-editor"]
description = "Open the Native Editor manual validation application"
program = "cargo"
args = ["run", "-p", "node-editor-demo"]

[commands."native.advanced-figures"]
description = "Open the Native advanced Figure and routing example"
program = "cargo"
args = ["run", "-p", "advanced-figures-app"]

[commands."replay.editor-g3"]
description = "Replay selection, targeting, and widget arbitration without a window"
program = "cargo"
args = [
  "run",
  "-p",
  "node-editor-demo",
  "--",
  "--headless-replay=g3",
  "--report=target/verification/reports/node-editor-g3.json",
]

[commands."replay.editor-g4"]
description = "Replay bounds editing and command history without a window"
program = "cargo"
args = [
