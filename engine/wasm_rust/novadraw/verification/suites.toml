schema_version = 1
evidence_root = "target/verification"

[documentation]
parity_ledgers = [
  "doc/parity/draw2d/api-coverage.md",
  "doc/parity/gef/api-coverage.md",
]
markdown_roots = ["doc", "book/src"]
typed_markdown_roots = ["doc"]
command_reference_roots = ["doc", "book/src"]
public_api_command = "test.facade-doc"
allowed_document_types = [
  "archive",
  "architecture-decision",
  "architecture-review",
  "documentation-index",
  "implementation-verification",
  "manual-verification",
  "migration-guide",
  "normative-design",
  "parity-contract",
  "product-strategy",
  "proposal",
  "reference-analysis",
  "roadmap",
  "verification",
  "verification-plan",
  "verification-record",
]
allowed_parity_statuses = [
  "specified",
  "partial",
  "verified",
  "deferred",
  "rejected",
]

[[documentation.index_sections]]
index = "doc/design/00-index.md"
heading = "核心设计"
target_root = "doc/design"
allowed_types = ["normative-design"]

[[documentation.index_sections]]
index = "doc/design/00-index.md"
heading = "非规范提案"
target_root = "doc/design"
allowed_types = ["proposal"]

[commands."workspace.fmt"]
description = "Check Rust formatting for the complete workspace"
program = "cargo"
args = ["fmt", "--all", "--", "--check"]

[commands."workspace.check"]
description = "Compile all workspace packages"
program = "cargo"
args = ["check", "--workspace"]

[commands."workspace.clippy"]
description = "Reject Clippy warnings in workspace targets"
program = "cargo"
args = ["clippy", "--workspace", "--", "-D", "warnings"]

[commands."workspace.test"]
description = "Run all workspace unit, integration, and documentation tests"
program = "cargo"
args = ["test", "--workspace"]

[commands."facade.core"]
description = "Compile the standard facade without a platform backend"
program = "cargo"
args = ["check", "-p", "novadraw", "--no-default-features"]

[commands."test.facade-doc"]
description = "Verify positive and negative facade import examples independently"
program = "cargo"
args = ["test", "-p", "novadraw", "--doc"]

[commands."backend.native-vello"]
description = "Compile the native Vello backend"
program = "cargo"
args = [
  "check",
  "-p",
  "novadraw-backend-vello",
  "--features",
  "native",
]

[commands."backend.web-vello"]
description = "Compile the Web Vello backend"
program = "cargo"
args = [
  "check",
  "-p",
  "novadraw-backend-vello",
  "--target",
  "wasm32-unknown-unknown",
  "--features",
  "web",
]

[commands."facade.dependencies"]
description = "Reject editor, inspector, backend, and platform dependencies from Core"
program = "./scripts/check_facade_dependencies.sh"

[commands."api.third-party-types"]
description = "Reject Kurbo, Vello, and Winit types from public API signatures"
program = "./scripts/check_public_api_dependencies.sh"

[commands."dependencies.kurbo"]
description = "Require one Kurbo version across all workspace feature graphs"
program = "./scripts/check_kurbo_versions.sh"

[commands."report.binary-size"]
description = "Build a representative release application and record its binary size"
program = "./scripts/report_binary_size.sh"

[commands."report.ga2-performance"]
description = "Run isolated headless CPU scenarios and retain timing, work, and peak RSS samples"
program = "cargo"
args = [
  "run",
  "--release",
  "-p",
  "r8-perf",
  "--",
  "--report=target/verification/reports/ga2-novadraw.json",
]

[commands."report.ga2-draw2d-performance"]
description = "Run same-host Draw2D reference scenarios with isolated JVMs"
program = "./third_party/draw2d-examples/run_performance.sh"

[commands."report.ga2-native-vello-performance"]
description = "Measure Native Vello CPU stages and GPU queue completion"
program = "cargo"
args = [
  "run",
  "--release",
  "-p",
  "native-vello-perf",
  "--",
  "--report=target/verification/reports/ga2-native-vello.json",
]

[commands."report.ga2-native-presentation-performance"]
description = "Measure Native Vello with a required visible macOS surface present"
program = "./benchmarks/native-vello-perf/run_macos_app.sh"
args = ["--report=target/verification/reports/ga2-native-presentation.json"]

[commands."report.ga2-native-window-server-performance"]
description = "Measure synthetic input through WindowServer-visible marker presentation on macOS"
program = "./benchmarks/native-vello-perf/run_macos_app.sh"
args = [
  "--require-window-server-present",
  "--report=target/verification/reports/ga2-native-window-server.json",
]

[commands."report.ga2-webgpu-browser-performance"]
description = "Measure Vello WebGPU queue completion and the following visible Chrome animation frame"
program = "./scripts/run_webgpu_browser_performance.sh"

[commands."test.ga2-webgpu-browser-runner"]
description = "Reject incomplete, hidden, dirty, software-rendered, or overstated WebGPU evidence"
program = "./scripts/test_webgpu_browser_performance.sh"

[commands."test.ga2-work-counters"]
description = "Enforce linear text-style and independent-routing work counters"
program = "cargo"
args = [
  "test",
  "-p",
  "novadraw",
  "--test",
  "m9_connection_runtime",
  "--test",
  "m10_label_contract",
]

