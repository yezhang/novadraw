<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novadraw Web Validation</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body data-ready="false">
    <header>
      <div>
        <p class="eyebrow">Novadraw</p>
        <h1>Web Runtime Validation</h1>
      </div>
      <output id="runtime-status">Loading Wasm runtime…</output>
    </header>

    <main>
      <section class="workspace" aria-label="Interactive runtime canvas">
        <nav class="theme-tabs" aria-label="Validation theme" role="tablist">
          <button id="theme-input" type="button" role="tab" aria-selected="true">Input</button>
          <button id="theme-shape" type="button" role="tab" aria-selected="false">Shapes</button>
          <button id="theme-viewport" type="button" role="tab" aria-selected="false">Viewport</button>
        </nav>
        <div class="scene-toolbar">
          <div>
            <p id="theme-title">Input</p>
            <strong id="scene-title">Pointer, keyboard and wheel</strong>
          </div>
          <div class="scene-controls">
            <button id="previous-scene" class="icon-button" type="button" aria-label="Previous scene">‹</button>
            <output id="scene-count">1/1</output>
            <button id="next-scene" class="icon-button" type="button" aria-label="Next scene">›</button>
          </div>
        </div>
        <canvas
          id="novadraw-canvas"
          tabindex="0"
          role="application"
          aria-label="Novadraw interactive canvas"
        ></canvas>
      </section>

      <aside aria-label="Validation state">
        <div class="metric">
          <span>Backend</span>
          <strong id="backend-status">Initializing WebGPU</strong>
        </div>
        <div class="metric">
          <span>Pointer</span>
          <strong id="pointer-status">Idle</strong>
        </div>
        <div class="metric">
          <span>Keyboard</span>
          <strong id="keyboard-status">No key received</strong>
        </div>
        <div class="metric">
          <span>Surface</span>
          <strong id="surface-status">Pending</strong>
        </div>
        <button id="toggle-scale" type="button">Toggle 1x / 2x DPR</button>
      </aside>
    </main>

    <script type="module">
      import init from "./pkg/web_validation.js";

      init().catch((error) => {
        document.body.dataset.ready = "error";
        document.querySelector("#runtime-status").textContent = `ERROR · ${error}`;
        console.error(error);
      });
    </script>
  </body>
</html>
