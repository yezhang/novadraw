[package]
name = "web-validation"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
novadraw = { path = "../../../novadraw", default-features = false, features = ["web-vello"] }
novadraw-apps = { path = "../../support", default-features = false }
novadraw-demo-scenes = { path = "../../scenes" }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.54"

[dependencies.web-sys]
version = "0.3.104"
features = [
  "CanvasRenderingContext2d",
  "console",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "HtmlButtonElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "KeyboardEvent",
  "Location",
  "PointerEvent",
  "Performance",
  "UrlSearchParams",
  "WheelEvent",
  "Window",
]
