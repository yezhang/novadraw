[package]
name = "novadraw"
version.workspace = true
edition.workspace = true
readme = "README.md"

[features]
default = []
native-vello = ["dep:novadraw-backend-vello", "novadraw-backend-vello/native"]
web-vello = ["dep:novadraw-backend-vello", "novadraw-backend-vello/web"]

[dependencies]
novadraw-geometry = { path = "../novadraw-geometry" }
novadraw-core = { path = "../novadraw-core" }
novadraw-render = { path = "../novadraw-render" }
novadraw-scene = { path = "../novadraw-scene" }
novadraw-editor = { path = "../novadraw-editor" }
novadraw-backend-vello = { path = "../novadraw-backend-vello", optional = true }

[package.metadata.docs.rs]
features = ["native-vello"]
no-default-features = true
