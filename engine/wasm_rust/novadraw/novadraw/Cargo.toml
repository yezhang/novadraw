[package]
name = "novadraw"
version.workspace = true
edition.workspace = true

[features]
default = ["vello"]
vello = ["novadraw-render/vello", "novadraw-scene/vello"]
vello-web = ["novadraw-render/vello-web"]

[dependencies]
slotmap.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
novadraw-geometry = { path = "../novadraw-geometry" }
novadraw-core = { path = "../novadraw-core" }
novadraw-render = { path = "../novadraw-render" }
novadraw-scene = { path = "../novadraw-scene" }
