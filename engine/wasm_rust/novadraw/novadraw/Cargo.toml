[package]
name = "novadraw"
version.workspace = true
edition.workspace = true
readme = "README.md"

[features]
default = []
native-vello = ["novadraw-render/vello"]
web-vello = ["novadraw-render/vello-web"]

[dependencies]
novadraw-geometry = { path = "../novadraw-geometry" }
novadraw-core = { path = "../novadraw-core" }
novadraw-render = { path = "../novadraw-render" }
novadraw-scene = { path = "../novadraw-scene" }
novadraw-editor = { path = "../novadraw-editor" }

[package.metadata.docs.rs]
features = ["native-vello"]
no-default-features = true
