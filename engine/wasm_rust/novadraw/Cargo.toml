[workspace]
resolver = "3"
members = [
  "novadraw",
  "novadraw-math",
  "novadraw-geometry",
  "novadraw-core",
  "novadraw-render",
  "novadraw-scene",
  "novadraw-editor",
  "novadraw-apps",
  "novadraw-demo-scenes",
  "tools/xtask",

  "apps/native/node-editor-demo",
  "apps/native/vello-app",
  "apps/native/shape-app",
  "apps/native/style-app",
  "apps/native/ndcanvas-app",
  "apps/native/transform-app",
  "apps/native/viewport-app",
  "apps/native/clip-app",
  "apps/native/layout-app",
  "apps/native/event-app",
  "apps/native/border-app",
  "apps/native/text-app",
  "apps/native/widgets-app",
  "apps/native/update-app",
  "apps/native/scroll-pane-demo",
  "apps/native/connections-demo",
  "apps/web/web-validation",
  "apps/benchmarks/r8-perf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
vello = "0.10.0"
glam = "0.30.9"
slotmap = "1.0.7"
uuid = { version = "1.18.1", features = ["v4", "serde", "js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
anyhow = "1.0.99"
winit = "0.30.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
pollster = "0.4.0"
stacker = "0.1.25"
parley = "0.7.0"
unicode-segmentation = "1.12.0"
resvg = { version = "0.45.1", default-features = false, features = ["text", "raster-images"] }
toml = "0.9"
