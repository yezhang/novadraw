[workspace]
resolver = "3"
members = [
  "novadraw",
  "novadraw-backend-vello",
  "novadraw-platform-winit",
  "novadraw-platform-web",
  "novadraw-editor",
  "novadraw-inspector",
  "examples/support",
  "examples/scenes",
  "tools/xtask",

  "examples/native/node-editor-demo",
  "examples/native/vello-app",
  "examples/native/shape-app",
  "examples/native/style-app",
  "examples/native/ndcanvas-app",
  "examples/native/transform-app",
  "examples/native/viewport-app",
  "examples/native/clip-app",
  "examples/native/layout-app",
  "examples/native/event-app",
  "examples/native/border-app",
  "examples/native/text-app",
  "examples/native/widgets-app",
  "examples/native/update-app",
  "examples/native/scroll-pane-demo",
  "examples/native/connections-demo",
  "examples/native/advanced-figures-app",
  "examples/web/web-validation",
  "benchmarks/r8-perf",
  "benchmarks/native-vello-perf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
vello = "0.10.0"
slotmap = "1.0.7"
uuid = { version = "1.18.1", features = ["v4", "serde", "js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
anyhow = "1.0.99"
winit = "0.30.12"
raw-window-handle = "0.6.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
pollster = "0.4.0"
stacker = "0.1.25"
parley = "0.7.0"
kurbo = "0.13.1"
unicode-segmentation = "1.12.0"
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
toml = "0.9"
