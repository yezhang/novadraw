[package]
name = "novadraw-example-support"
version.workspace = true
edition.workspace = true
publish = false
description = "Shared host and utilities for Novadraw examples"

[features]
default = ["native"]
egui-panel = ["native", "dep:egui", "dep:egui-winit", "dep:egui-wgpu", "novadraw-backend-vello/native-overlay"]
native = [
  "dep:novadraw-backend-vello",
  "novadraw-backend-vello/native",
  "dep:novadraw-platform-winit",
  "dep:winit",
]

[dependencies]
# novadraw 核心库
novadraw = { path = "../../crates/novadraw", default-features = false }
novadraw-backend-vello = { path = "../../crates/novadraw-backend-vello", optional = true }
novadraw-platform-winit = { path = "../../crates/novadraw-platform-winit", optional = true }

# winit 窗口管理
winit = { workspace = true, optional = true }

# 工具库
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
egui = { version = "0.35", optional = true }
egui-winit = { version = "0.35", default-features = false, features = ["clipboard", "x11", "wayland"], optional = true }
egui-wgpu = { version = "0.35", default-features = false, optional = true }
