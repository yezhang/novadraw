[package]
name = "web-validation"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
novadraw = { path = "../../../novadraw" }
novadraw-backend-vello = { path = "../../../novadraw-backend-vello", features = ["web"] }
novadraw-editor = { path = "../../../novadraw-editor" }
novadraw-platform-web = { path = "../../../novadraw-platform-web", features = ["editor"] }
novadraw-example-scenes = { path = "../../scenes" }
js-sys = "0.3.104"
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.54"

[dependencies.web-sys]
version = "0.3.104"
features = [
  "CanvasRenderingContext2d",
  "console",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "HtmlButtonElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "Navigator",
  "PointerEvent",
  "Performance",
  "UrlSearchParams",
  "WheelEvent",
  "Window",
]
