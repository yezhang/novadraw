[package]
name = "draw2d-official-examples"
version.workspace = true
edition.workspace = true
publish = false
default-run = "draw2d-official-examples"

[dependencies]
novadraw = { path = "../../../crates/novadraw", default-features = false }
novadraw-example-support = { path = "../../support", features = ["egui-panel"] }
novadraw-backend-vello = { path = "../../../crates/novadraw-backend-vello" }
novadraw-platform-winit = { path = "../../../crates/novadraw-platform-winit", features = ["canvas"] }
winit-canvas = { path = "../../../crates/winit-canvas", features = ["gpu"] }
vello.workspace = true
winit.workspace = true
pollster.workspace = true
anyhow.workspace = true
parley.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
