[package]
name = "gef-editor-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
default-run = "gef-editor-demo"

[dependencies]
novadraw = { path = "../../../crates/novadraw" }
novadraw-editor = { path = "../../../crates/novadraw-editor" }
novadraw-platform-masonry = { path = "../../../crates/novadraw-platform-masonry" }
xilem.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
masonry_testing.workspace = true
masonry_imaging.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
