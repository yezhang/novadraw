[package]
name = "gef-editor-demo"
version = "0.1.0"
edition = "2024"
license.workspace = true
default-run = "gef-editor-demo"
publish = false

[dependencies]
novadraw-example-support = { path = "../../../../../examples/support", default-features = false, features = ["egui-workbench"] }
novadraw = { path = "../../../../novadraw" }
novadraw-backend-vello = { path = "../../../../novadraw-backend-vello" }
novadraw-editor = { path = "../../.." }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "x11", "wayland"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-phosphor = { version = "0.13", default-features = false, features = ["regular"] }
egui-wgpu = { version = "0.37", default-features = false }
serde.workspace = true
serde_json.workspace = true
