[workspace]
resolver = "3"
members = ["crates/novadraw"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
slotmap = "1.0.7"
uuid = { version = "1.18.1", features = ["v4", "serde", "js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
stacker = "0.1.25"
parley = "0.7.0"
kurbo = "0.13.1"
unicode-segmentation = "1.12.0"
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
