[package]
name = "novadraw-parley-storage-candidate"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["parley/system"]
portable = ["parley/libm"]

[dependencies]
parley = { version = "=0.7.0", default-features = false, path = "../../../dependencies/parley-0.7.0" }
