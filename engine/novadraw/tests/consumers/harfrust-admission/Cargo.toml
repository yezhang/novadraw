[package]
name = "novadraw-harfrust-admission"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["harfrust/std"]
portable = []

[dependencies]
harfrust = { version = "=0.3.2", default-features = false, path = "../../../dependencies/harfrust-0.3.2" }

[[bin]]
name = "buffer-cost"
path = "src/cost.rs"

[[bin]]
name = "instance-cost"
path = "src/instance_cost.rs"

[[bin]]
name = "variation-cost"
path = "src/variation_cost.rs"

[[bin]]
name = "cold-cost"
path = "src/cold_cost.rs"

[[bin]]
name = "lookup-cost"
path = "src/lookup_cost.rs"

[[bin]]
name = "aat-cost"
path = "src/aat_cost.rs"

[[bin]]
name = "plan-cost"
path = "src/plan_cost.rs"

[[bin]]
name = "configuration-cost"
path = "src/configuration_cost.rs"

[[bin]]
name = "plan-layout-cost"
path = "src/plan_layout_cost.rs"

[[bin]]
name = "private-language-cost"
path = "src/private_language_cost.rs"

[[bin]]
name = "general-language-cost"
path = "src/general_language_cost.rs"

[[bin]]
name = "script-callbacks-cost"
path = "src/script_callbacks_cost.rs"

[[bin]]
name = "shape-cost"
path = "src/shape_cost.rs"

[[bin]]
name = "single-cost"
path = "src/single_cost.rs"

[[bin]]
name = "multiple-cost"
path = "src/multiple_cost.rs"

[[bin]]
name = "ligature-cost"
path = "src/ligature_cost.rs"

[[bin]]
name = "context-cost"
path = "src/context_cost.rs"
