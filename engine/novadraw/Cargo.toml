[workspace]
resolver = "3"
members = [
  "crates/novadraw-platform-masonry",
  "crates/novadraw-editor/examples/native/gef-editor-demo",
  "crates/novadraw-editor/examples/native/gef-logic-demo",
  "crates/novadraw",
  "crates/novadraw-richtext",
  "crates/novadraw-richtext/examples/native/rich-text-figure-app",
  "crates/novadraw-richtext/examples/native/richtext-figure-edit-app",
  "crates/novadraw-backend-vello",
  "crates/novadraw-platform-winit",
  "crates/novadraw-platform-web",
  "crates/novadraw-editor",
  "crates/novadraw-inspector",
  "crates/winit-canvas",
  "examples/support",
  "crates/novadraw/examples/scenes",
  "tools/xtask",

  "crates/novadraw-editor/examples/native/node-editor-demo",
  "examples/backend/vello-app",
  "examples/integration/winit-canvas-demo",
  "crates/novadraw/examples/native/shape-app",
  "crates/novadraw/examples/native/composite-shapes-app",
  "crates/novadraw/examples/native/style-app",
  "crates/novadraw/examples/native/ndcanvas-app",
  "crates/novadraw/examples/native/transform-app",
  "crates/novadraw/examples/native/viewport-app",
  "crates/novadraw/examples/native/clip-app",
  "crates/novadraw/examples/native/layout-app",
  "crates/novadraw/examples/native/event-app",
  "crates/novadraw/examples/native/border-app",
  "crates/novadraw/examples/native/text-app",
  "crates/novadraw/examples/native/textflow-large-app",
  "crates/novadraw/examples/native/widgets-app",
  "crates/novadraw/examples/native/update-app",
  "crates/novadraw/examples/native/scroll-pane-demo",
  "crates/novadraw/examples/native/connections-demo",
  "crates/novadraw/examples/native/advanced-figures-app",
  "crates/novadraw/examples/native/animation-app",
  "crates/novadraw/examples/native/uml-demo",
  "crates/novadraw/examples/native/draw2d-official-examples",
  "examples/integration/web-validation",
  "benchmarks/r8-perf",
  "benchmarks/native-vello-perf",
]

# Keep the optional Masonry UI out of unqualified engine builds.
default-members = [
  "crates/novadraw",
  "crates/novadraw-richtext",
  "crates/novadraw-richtext/examples/native/rich-text-figure-app",
  "crates/novadraw-richtext/examples/native/richtext-figure-edit-app",
  "crates/novadraw-backend-vello",
  "crates/novadraw-platform-winit",
  "crates/novadraw-platform-web",
  "crates/novadraw-editor",
  "crates/novadraw-inspector",
  "crates/winit-canvas",
  "examples/support",
  "crates/novadraw/examples/scenes",
  "tools/xtask",

  "crates/novadraw-editor/examples/native/node-editor-demo",
  "examples/backend/vello-app",
  "examples/integration/winit-canvas-demo",
  "crates/novadraw/examples/native/shape-app",
  "crates/novadraw/examples/native/composite-shapes-app",
  "crates/novadraw/examples/native/style-app",
  "crates/novadraw/examples/native/ndcanvas-app",
  "crates/novadraw/examples/native/transform-app",
  "crates/novadraw/examples/native/viewport-app",
  "crates/novadraw/examples/native/clip-app",
  "crates/novadraw/examples/native/layout-app",
  "crates/novadraw/examples/native/event-app",
  "crates/novadraw/examples/native/border-app",
  "crates/novadraw/examples/native/text-app",
  "crates/novadraw/examples/native/textflow-large-app",
  "crates/novadraw/examples/native/widgets-app",
  "crates/novadraw/examples/native/update-app",
  "crates/novadraw/examples/native/scroll-pane-demo",
  "crates/novadraw/examples/native/connections-demo",
  "crates/novadraw/examples/native/advanced-figures-app",
  "crates/novadraw/examples/native/animation-app",
  "crates/novadraw/examples/native/uml-demo",
  "crates/novadraw/examples/native/draw2d-official-examples",
  "examples/integration/web-validation",
  "benchmarks/r8-perf",
  "benchmarks/native-vello-perf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release.package.gef-editor-demo]
strip = "symbols"

[profile.release.package.gef-logic-demo]
strip = "symbols"

[workspace.dependencies]
masonry = { git = "https://github.com/linebender/xilem", rev = "66c8893f12232b9d5cdf4296f773aa3dc07ee776" }
xilem_masonry = { git = "https://github.com/linebender/xilem", rev = "66c8893f12232b9d5cdf4296f773aa3dc07ee776" }
xilem = { git = "https://github.com/linebender/xilem", rev = "66c8893f12232b9d5cdf4296f773aa3dc07ee776" }
masonry_testing = { git = "https://github.com/linebender/xilem", rev = "66c8893f12232b9d5cdf4296f773aa3dc07ee776" }
masonry_winit = { git = "https://github.com/linebender/xilem", rev = "66c8893f12232b9d5cdf4296f773aa3dc07ee776" }
masonry_imaging = { git = "https://github.com/linebender/xilem", rev = "66c8893f12232b9d5cdf4296f773aa3dc07ee776" }
vello = "0.10.0"
slotmap = "1.0.7"
uuid = { version = "1.18.1", features = ["v4", "serde", "js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
anyhow = "1.0.99"
winit = "0.30.12"
raw-window-handle = "0.6.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
pollster = "0.4.0"
stacker = "0.1.25"
# Core needs dictionary-backed word and line segmentation for CJK and Thai.
parley = { version = "=0.12.0", features = ["complex-scripts"] }
kurbo = "0.13.1"
unicode-segmentation = "1.12.0"
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
